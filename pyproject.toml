[project]
name = "ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arjun118", email = "vishnutejach3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.5",
    "huggingface-hub>=2.2.0",
    "indra-ocr>=0.3.2",
